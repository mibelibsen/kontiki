<!DOCTYPE html><html lang="da"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--ink:#1a2233;--muted:#586074;--line:#d3dae7;--panel:#fff;--bg:#f4f6fa;--accent:#1f6fd6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.brand{display:block;text-decoration:none;color:var(--ink);font-weight:800;margin-bottom:14px}.brand span{color:var(--accent)}
.boks{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(26,34,51,.06)}
video{display:block;width:100%;max-width:360px;margin:0 auto;aspect-ratio:3/4;border-radius:12px;background:#000}
h1{font-size:1.3rem;margin:16px 0 8px}p{margin:0;color:var(--muted);line-height:1.5}
a.tilbage{display:inline-block;margin-top:16px;color:var(--accent);font-weight:700;text-decoration:none}

/* Telefon: en bred tabel ruller selv i stedet for at skubbe hele
   siden sidelaens, og en figur i en graphwrap kan krympe. */
@media(max-width:600px){table{display:block;overflow-x:auto}
.graphwrap svg{flex:1 1 auto;max-width:100%;height:auto}}

/* Knapper. Tre ting, maalt paa 360-1280 px:
   1. En raekke knapper stod 6-7 px forskudt. De er inline-flex med hver sin
      polstring og staar derfor paa hver sin tekstlinje. vertical-align
      stiller dem paa samme linje, og samme margen giver samme mellemrum.
   2. En finger skal kunne ramme. 44 px er det maal, baade Apple og Google
      bruger; flere knapper var 37.
   3. Menuen i toppen braekkede over to linjer paa en telefon, og den faste
      header aad 150 px af skaermen hele tiden. Den ruller nu vandret paa
      én linje i stedet. */
@media(min-width:601px){
/* Samme kasse til alle tre, saa de staar paa linje: .btn var 46 px, den med
   ramme 48, og printbtn 44 - derfor stod de forskudt. */
.hero .btn,.hero .btnlink,.hero .printbtn{vertical-align:top;height:48px;
padding:0 20px;box-sizing:border-box;display:inline-flex;align-items:center;
justify-content:center;margin:12px 8px 0 0}}
.btn,.btnlink,.printbtn,.vaelg a{min-height:44px}
.jump a{display:inline-flex;align-items:center;min-height:40px}
@media(max-width:600px){
.top-inner{gap:10px;padding:10px 16px}
header.top .jump{width:100%;margin-left:0;gap:4px}
header.top .jump a{padding:5px 9px;font-size:.8rem;min-height:40px}}
</style></head><body><main>

<h1>Sådan spørger du på tysk</h1>
<p>Peter Hoffmann viser, hvordan du spørger unge på tysk, om de vil udfylde spørgeskemaet. Se den et par gange, og sig sætningerne højt, til den sidder. Så er det bare at holde kortet frem, hvis du har brug for at supplere.</p>

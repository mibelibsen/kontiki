<!DOCTYPE html><html lang="da"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Antal svar · Ung i Tyskland</title>
<style>
:root{--ink:#1a2233;--muted:#586074;--line:#d3dae7;--panel:#fff;--bg:#f4f6fa;--accent:#1f6fd6;--good:#1d9a6c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
.brand{display:block;text-decoration:none;color:var(--ink);font-weight:800;margin-bottom:14px}.brand span{color:var(--accent)}
.boks{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(26,34,51,.06);margin-bottom:14px}
h1{font-size:1.3rem;margin:0 0 4px}.tal{font-size:3rem;font-weight:800;line-height:1;margin:6px 0}p{margin:4px 0;color:var(--muted)}
svg{width:100%;height:auto;display:block}
button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:.95rem;cursor:pointer;font-family:inherit;min-height:44px}
a{color:var(--accent)}

/* Telefon: en bred tabel ruller selv i stedet for at skubbe hele
   siden sidelaens, og en figur i en graphwrap kan krympe. */
@media(max-width:600px){table{display:block;overflow-x:auto}
.graphwrap svg{flex:1 1 auto;max-width:100%;height:auto}}

/* Knapper. Tre ting, maalt paa 360-1280 px:
   1. En raekke knapper stod 6-7 px forskudt. De er inline-flex med hver sin
      polstring og staar derfor paa hver sin tekstlinje. vertical-align
      stiller dem paa samme linje, og samme margen giver samme mellemrum.
   2. En finger skal kunne ramme. 44 px er det maal, baade Apple og Google
      bruger; flere knapper var 37.
   3. Menuen i toppen braekkede over to linjer paa en telefon, og den faste
      header aad 150 px af skaermen hele tiden. Den ruller nu vandret paa
      én linje i stedet. */
@media(min-width:601px){
/* Samme kasse til alle tre, saa de staar paa linje: .btn var 46 px, den med
   ramme 48, og printbtn 44 - derfor stod de forskudt. */
.hero .btn,.hero .btnlink,.hero .printbtn{vertical-align:top;height:48px;
padding:0 20px;box-sizing:border-box;display:inline-flex;align-items:center;
justify-content:center;margin:12px 8px 0 0}}
.btn,.btnlink,.printbtn,.vaelg a{min-height:44px}
.jump a{display:inline-flex;align-items:center;min-height:40px}
@media(max-width:600px){
.top-inner{gap:10px;padding:10px 16px}
header.top .jump{width:100%;margin-left:0;gap:4px}
header.top .jump a{padding:5px 9px;font-size:.8rem;min-height:40px}}
</style></head><body><main>
<a class="brand" href="index.html">9. klasse</a>
<div class="boks"><h1>Svar på spørgeskemaet</h1><div class="tal" id="ialt">…</div>
<p id="status">Henter tallene fra regnearket …</p>
<p><button onclick="hent()">Opdatér</button></p></div>
<div class="boks"><h2 style="font-size:1.05rem;margin:0 0 10px">Svar pr. ung</h2><div id="figur"></div>
<p style="font-size:.85rem;margin-top:10px">Tallene læses direkte fra fanen Svar i regnearket, hver gang siden åbnes. Tryk Opdatér for at hente igen.</p></div>
<p><a href="tysk-spoergeskema.html">Om projektet</a> · <a href="https://docs.google.com/spreadsheets/d/1QwwgmHeMVc-lsMEtmXtT4BobkF0HGyjVr9Twi1tCWbY/edit" target="_blank" rel="noopener">Regnearket</a></p>
</main>
<script>
const UNGER = [["Anna", "anna"], ["Kasper", "kasper"], ["Asta", "asta"], ["Luna", "luna"], ["Caroline", "caroline"], ["Milius", "milius"], ["Clara", "clara"], ["Nor", "nor"], ["Emilie", "emilie"], ["Oskar", "oskar"], ["Emily", "emily"], ["Ronja", "ronja"], ["Flora", "flora"], ["Savanna", "savanna"], ["Frida", "frida"], ["Silke", "silke"], ["Helene", "helene"], ["Simone", "simone"], ["Hjalte", "hjalte"], ["Viktor", "viktor"], ["Johan", "johan"], ["William", "william"], ["Jonas", "jonas"]];
const KILDE = 'https://docs.google.com/spreadsheets/d/1QwwgmHeMVc-lsMEtmXtT4BobkF0HGyjVr9Twi1tCWbY/gviz/tq?tqx=out:csv&sheet=Svar';
function csv(t){const r=[];let f='',row=[],q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'&&t[i+1]=='"'){f+='"';i++;}else if(c=='"')q=false;else f+=c;}else if(c=='"')q=true;else if(c==','){row.push(f);f='';}else if(c=='\n'){row.push(f);r.push(row);row=[];f='';}else if(c!='\r')f+=c;}if(f||row.length){row.push(f);r.push(row);}return r;}
function tegn(taelling){
  const n=UNGER.length, rh=26, w=600, lw=110, maxv=Math.max(1,...Object.values(taelling));
  let s=`<svg viewBox="0 0 ${w} ${n*rh+10}" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,Arial" font-size="13">`;
  UNGER.forEach(([navn,kode],i)=>{const v=taelling[kode]||0, bw=(w-lw-50)*v/maxv, y=i*rh+5;
    s+=`<text x="${lw-8}" y="${y+17}" text-anchor="end" fill="#1a2233">${navn}</text>`;
    s+=`<rect x="${lw}" y="${y+3}" width="${Math.max(bw,v?4:0)}" height="${rh-8}" rx="4" fill="${v?'#1f6fd6':'#e9edf4'}"/>`;
    if(!v)s+=`<rect x="${lw}" y="${y+3}" width="${w-lw-50}" height="${rh-8}" rx="4" fill="#e9edf4"/>`;
    s+=`<text x="${lw+Math.max(bw,v?4:0)+8}" y="${y+17}" fill="#586074" font-weight="700">${v}</text>`;});
  return s+'</svg>';
}
async function hent(){
  const st=document.getElementById('status');st.textContent='Henter …';
  try{const t=await (await fetch(KILDE+'&t='+Date.now(),{cache:'no-store'})).text();
    const rows=csv(t).slice(1).filter(r=>r.length>1&&r[0]);
    const taelling={};let ukendt=0;
    rows.forEach(r=>{const k=(r[1]||'').trim().toLowerCase().replace(/ /g,'-').replace(/\./g,'');if(UNGER.some(u=>u[1]==k))taelling[k]=(taelling[k]||0)+1;else ukendt++;});
    document.getElementById('ialt').textContent=rows.length;
    st.textContent=`svar i alt · ${Object.keys(taelling).length} af ${UNGER.length} unger har fået svar`+(ukendt?` · ${ukendt} svar uden kendt kode`:'')+` · hentet ${new Date().toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'})}`;
    document.getElementById('figur').innerHTML=tegn(taelling);
  }catch(e){st.textContent='Kunne ikke hente regnearket. Prøv igen om lidt.';}
}
hent();
</script></body></html>
